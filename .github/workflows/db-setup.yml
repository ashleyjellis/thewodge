# Database setup and maintenance for the two data products.
#
# Manual only, and the opposite kind of work to pipeline.yml: that one runs
# unattended on a schedule and only ever reads from provider websites, while
# this makes structural writes to a database and is run deliberately.
#
# Both operations are idempotent — drizzle tracks which migrations have been
# applied, and seeding is INSERT OR IGNORE — so re-running is safe and never
# reverts anything edited afterwards in an admin UI.
#
# Covers the pricing archive and the performance tracker. Whichever is
# selected, only that one's secrets are required, so the tracker can be stood
# up before the archive's R2 storage exists, or vice versa.

name: Database setup

on:
  workflow_dispatch:
    inputs:
      database:
        description: "Which database"
        required: true
        type: choice
        options: [archive, tracker]
        default: archive
      action:
        description: "What to run"
        required: true
        type: choice
        options: [both, migrate, seed, seed-providers-only, seed-demo, seed-demo-reset]
        default: both

concurrency:
  group: db-setup-${{ inputs.database }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      ARCHIVE_TURSO_DATABASE_URL: ${{ secrets.ARCHIVE_TURSO_DATABASE_URL }}
      ARCHIVE_TURSO_AUTH_TOKEN: ${{ secrets.ARCHIVE_TURSO_AUTH_TOKEN }}
      TRACKER_TURSO_DATABASE_URL: ${{ secrets.TRACKER_TURSO_DATABASE_URL }}
      TRACKER_TURSO_AUTH_TOKEN: ${{ secrets.TRACKER_TURSO_AUTH_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      # Every client in this repo falls back to a local SQLite file when its
      # credentials are absent — which is what makes local development work
      # with no setup, and exactly the wrong behaviour here. Without this gate
      # a misconfigured run would migrate and seed a file on the runner, then
      # report success as that file was discarded.
      - name: Verify the selected database is configured
        env:
          DATABASE: ${{ inputs.database }}
        run: |
          if [ "$DATABASE" = "archive" ]; then
            vars="ARCHIVE_TURSO_DATABASE_URL ARCHIVE_TURSO_AUTH_TOKEN"
          else
            vars="TRACKER_TURSO_DATABASE_URL TRACKER_TURSO_AUTH_TOKEN"
          fi
          missing=()
          for var in $vars; do
            [ -z "${!var}" ] && missing+=("$var")
          done
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Missing repository secrets: ${missing[*]}"
            exit 1
          fi
          echo "$DATABASE database configured."

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - uses: actions/setup-python@v5
        if: inputs.database == 'archive'
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install Python dependencies
        if: inputs.database == 'archive'
        run: pip install -r pipeline/requirements.txt

      - name: Apply migrations
        if: inputs.action == 'both' || inputs.action == 'migrate'
        run: pnpm ${{ inputs.database }}:db:migrate

      # Only the archive has seed data at present; the tracker's demo seed
      # arrives with its own command and is deliberately not run against a
      # live database from here.
      - name: Seed providers and sources
        if: inputs.database == 'archive' && (inputs.action == 'both' || inputs.action == 'seed')
        run: python -m pipeline.seed

      - name: Seed providers only
        if: inputs.database == 'archive' && inputs.action == 'seed-providers-only'
        run: python -m pipeline.seed --providers

      # The tracker's demo dataset. Only ever on an explicitly chosen action,
      # never as part of "both", so it cannot be run by accident.
      #
      # Safe to run from here because the seed refuses in three separate ways:
      # when VITE_DEMO_MODE is 0, when the database holds any provider not
      # marked as demo, and when demo data already exists without --reset. The
      # second is the one that matters — environment variables get
      # misconfigured, while the presence of a real published record is a fact
      # about the database itself.
      - name: Seed the tracker demo dataset
        if: inputs.database == 'tracker' && inputs.action == 'seed-demo'
        run: pnpm tracker:seed:demo

      - name: Replace the tracker demo dataset
        if: inputs.database == 'tracker' && inputs.action == 'seed-demo-reset'
        run: pnpm tracker:seed:reset

      # Reported into the run summary so the outcome is visible without
      # digging through logs, and so a run that silently did nothing is
      # obvious at a glance. Deliberately not always() — if an earlier step
      # failed, its own error is the useful one.
      - name: Report archive state
        if: inputs.database == 'archive'
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          from contextlib import closing
          from pipeline import db

          with closing(db.connect()) as c:
              def count(table):
                  return db.query(c, f"select count(*) n from {table}")[0]["n"]

              print("## Archive state\n")
              print("| Table | Rows |")
              print("|---|---|")
              for table in ("providers", "sources", "snapshots", "charges", "review_queue"):
                  print(f"| {table} | {count(table)} |")

              rows = db.query(c, """
                  select p.name, s.label, s.url, s.check_frequency
                  from sources s join providers p on p.id = s.provider_id
                  order by p.name, s.id
              """)
              if rows:
                  print("\n### Collection targets\n")
                  print("| Provider | Page | Cadence |")
                  print("|---|---|---|")
                  for r in rows:
                      print(f"| {r['name']} | [{r['label']}]({r['url']}) | {r['check_frequency']} |")
          PY

      - name: Report tracker state
        if: inputs.database == 'tracker'
        run: npx tsx scripts/tracker-db-report.ts >> "$GITHUB_STEP_SUMMARY"
