# Provider pricing archive — one-off setup and maintenance.
#
# Separate from pipeline.yml because it does the opposite kind of work:
# pipeline.yml runs unattended on a schedule and only ever reads from
# providers, while this one is manual, occasional, and writes structural
# changes to the archive database.
#
# Both operations are idempotent — drizzle tracks which migrations have been
# applied, and the seed is INSERT OR IGNORE — so re-running is safe and never
# reverts anything edited afterwards in the admin UI.
#
# Needs only the two Turso secrets. It touches no provider websites and no
# object storage, so it can be run before R2 exists.

name: Archive setup

on:
  workflow_dispatch:
    inputs:
      action:
        description: "What to run"
        required: true
        type: choice
        options: [both, migrate, seed, seed-providers-only]
        default: both

concurrency:
  group: archive-setup
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      ARCHIVE_TURSO_DATABASE_URL: ${{ secrets.ARCHIVE_TURSO_DATABASE_URL }}
      ARCHIVE_TURSO_AUTH_TOKEN: ${{ secrets.ARCHIVE_TURSO_AUTH_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      # Without these the clients fall back to a local SQLite file on the
      # runner, which is discarded when the job ends — a "successful" run that
      # migrated and seeded nothing. Fail loudly instead.
      - name: Verify the archive database is configured
        run: |
          missing=()
          for var in ARCHIVE_TURSO_DATABASE_URL ARCHIVE_TURSO_AUTH_TOKEN; do
            [ -z "${!var}" ] && missing+=("$var")
          done
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Missing repository secrets: ${missing[*]}"
            exit 1
          fi
          echo "Archive database configured."

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install Python dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Apply migrations
        if: inputs.action == 'both' || inputs.action == 'migrate'
        run: pnpm archive:db:migrate

      - name: Seed providers and sources
        if: inputs.action == 'both' || inputs.action == 'seed'
        run: python -m pipeline.seed

      - name: Seed providers only
        if: inputs.action == 'seed-providers-only'
        run: python -m pipeline.seed --providers

      # Reported into the run summary so the outcome is visible without
      # digging through logs, and so a run that silently did nothing is
      # obvious at a glance. Deliberately not always() — if an earlier step
      # failed, its own error is the useful one, and this would only add a
      # second confusing failure on top of it.
      - name: Report archive state
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          from contextlib import closing
          from pipeline import db

          with closing(db.connect()) as c:
              def count(table):
                  return db.query(c, f"select count(*) n from {table}")[0]["n"]

              print("## Archive state\n")
              print("| Table | Rows |")
              print("|---|---|")
              for table in ("providers", "sources", "snapshots", "charges", "review_queue"):
                  print(f"| {table} | {count(table)} |")

              rows = db.query(c, """
                  select p.name, s.label, s.url, s.check_frequency
                  from sources s join providers p on p.id = s.provider_id
                  order by p.name, s.id
              """)
              if rows:
                  print("\n### Collection targets\n")
                  print("| Provider | Page | Cadence |")
                  print("|---|---|---|")
                  for r in rows:
                      print(f"| {r['name']} | [{r['label']}]({r['url']}) | {r['check_frequency']} |")
          PY
